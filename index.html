<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zade is turning one | A birthday invitation</title>
    <meta name="description" content="Zade Noah Saintfleur is turning one. We made him a small book, and we’d love you at his party." />
    <meta name="theme-color" content="#f9f4e9" />
    <!-- Private family invitation: keep it out of search engines and never leak the personal link via Referer. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / WhatsApp preview. The image is illustrated (no baby photo). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zade is turning one | A birthday invitation" />
    <meta property="og:description" content="We made Zade a small book. Open it, and come to his party." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Blue and gold birthday illustration with balloons, a golden crown and a large gold number one." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/images/book/cover-sky.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/book/zade-cutout.webp" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Georgia, serif; text-align: center; padding: 2rem">
        Zade Noah Saintfleur is turning one. Please turn on JavaScript to open his book and RSVP.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
